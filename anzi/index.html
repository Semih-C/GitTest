<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anzi Maliyet / Kâr</title>
<meta name="theme-color" content="#f5f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anzi Kasa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ee;--card:#fff;--ink:#1d1b19;--muted:#7a736c;--line:#e9e3dc;
  --gelir:#1d8a5a;--gelir-soft:#e3f3ea;--gider:#cf3f2b;--gider-soft:#fbe7e3;
  --accent:#cf3f2b;--accent-soft:#fbe7e3;--accent-ink:#fff;
  --r:16px;
}
body.ogi{--accent:#3346a8;--accent-soft:#e6e9f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Home */
#home{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom))}
.home-logo{display:block;width:84px;height:84px;border-radius:22px;margin:0 auto 16px;box-shadow:0 10px 24px rgba(184,50,31,.25)}
.home-title{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;margin:0 0 6px}
.home-sub{text-align:center;font-size:26px;font-weight:800;margin:0 0 28px}
.branch-btn{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border-radius:22px;padding:22px 20px;margin-bottom:14px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(40,25,10,.06);text-align:left;transition:transform .12s}
.branch-btn:active{transform:scale(.98)}
.branch-mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;flex:none}
.branch-mark{position:relative;overflow:hidden;border-radius:50%!important;width:64px!important;height:64px!important;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.branch-mark img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.branch-btn .nm{font-size:22px;font-weight:800}
.branch-btn .ds{font-size:14px;color:var(--muted);margin-top:2px}
.branch-btn .arr{margin-left:auto;font-size:26px;color:var(--muted)}

/* Branch header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
header.top .wrap{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:20px;box-shadow:0 1px 0 var(--line)}
.top h1{font-size:20px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;padding:8px 4px;border-radius:12px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}

.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

/* Entry */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{padding:14px;border-radius:14px;font-weight:800;font-size:17px;background:#f1ede8;color:var(--muted)}
.seg button.gider.on{background:var(--gider);color:#fff}
.seg button.gelir.on{background:var(--gelir);color:#fff}
.amount{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;padding:4px 14px;background:#fff}
.amount:focus-within{border-color:var(--ink)}
.amount input{border:0;outline:0;font-size:32px;font-weight:800;width:100%;padding:8px 0;background:transparent}
.amount span{font-size:26px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:9px 13px;border-radius:999px;background:#f1ede8;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:0;font-size:15px}
.field:focus{border-color:var(--ink)}
.save{width:100%;margin-top:14px;padding:16px;border-radius:14px;font-weight:800;font-size:17px;color:#fff;background:var(--ink)}
.save.gider{background:var(--gider)}.save.gelir{background:var(--gelir)}
.save:disabled{opacity:.5}

.today{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.mini{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 0 var(--line)}
.mini .k{font-size:12px;color:var(--muted);font-weight:600}
.mini .v{font-size:16px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list .day{font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 6px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none}
.item .ic.gelir{background:var(--gelir-soft);color:var(--gelir)}
.item .ic.gider{background:var(--gider-soft);color:var(--gider)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px}
.item .t small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:800;white-space:nowrap}
.a.gelir{color:var(--gelir)}.a.gider{color:var(--gider)}
.del{font-size:12px;font-weight:700;color:var(--muted);padding:6px 8px;border-radius:8px;background:#f3efea;margin-left:4px}
.del.arm{background:var(--gider);color:#fff}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}

/* Report */
.periods{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.periods::-webkit-scrollbar{display:none}
.periods button{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;box-shadow:0 1px 0 var(--line)}
.periods button.on{background:var(--accent);color:var(--accent-ink)}
.net{text-align:center;padding:22px 16px}
.net .k{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.net .v{font-size:38px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
.net .m{font-size:14px;color:var(--muted);font-weight:600}
.pos{color:var(--gelir)}.neg{color:var(--gider)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.two .card{margin:0}
.big{font-size:20px;font-weight:800;margin-top:2px}
.bar{margin:10px 0}
.bar .hd{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px;gap:8px}
.bar .hd span:last-child{white-space:nowrap}
.bar .tr{height:8px;border-radius:99px;background:#f1ede8;overflow:hidden}
.bar .fl{height:100%;border-radius:99px}
table.mt{width:100%;border-collapse:collapse;font-size:14px}
table.mt th{text-align:right;color:var(--muted);font-weight:700;font-size:12px;padding:6px 4px;text-transform:uppercase;letter-spacing:.04em}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt td{text-align:right;padding:9px 4px;border-top:1px solid var(--line);font-weight:600;white-space:nowrap}

/* Prices */
.pform .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pform .full{grid-column:1/-1}
.search{margin-bottom:12px}
details.prod{background:var(--card);border-radius:var(--r);margin-bottom:10px;box-shadow:0 1px 0 var(--line);overflow:hidden}
details.prod summary{list-style:none;padding:14px 16px;cursor:pointer}
details.prod summary::-webkit-details-marker{display:none}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph b{font-size:17px}
.ph small{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.sup{display:flex;align-items:center;gap:8px;padding:8px 0 0;font-size:15px}
.sup .n{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sup .p{font-weight:800;white-space:nowrap}
.tag{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;white-space:nowrap}
.tag.best{background:var(--gelir-soft);color:var(--gelir)}
.tag.up{background:var(--gider-soft);color:var(--gider)}
.hist{border-top:1px solid var(--line);padding:6px 16px 10px;background:#fbfaf8}
.hist .hr{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.hist .hr:last-child{border-bottom:0}
.hist .hr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0}

.note{background:#fff6dc;color:#6b5200;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transition:.2s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:320px;text-align:center}
#lock h2{font-size:24px;font-weight:800;margin:0 0 6px}
#lock p{color:var(--muted);margin:0 0 20px;font-size:15px}
.pins{display:flex;justify-content:center;gap:14px;margin-bottom:24px}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:block}
.pins i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:64px;border-radius:18px;background:var(--card);font-size:24px;font-weight:700;box-shadow:0 1px 0 var(--line)}
.pad button:active{background:#ece7e1}
.pad .ghost{background:transparent;box-shadow:none;font-size:16px;color:var(--muted)}
#lockErr{color:var(--gider);font-weight:700;height:20px;margin-top:14px;font-size:14px}
</style>
</head>
<body>

<!-- HOME -->
<section id="home">
  <div class="wrap">
    <img class="home-logo" src="icon-192.png" alt="" width="84" height="84">
    <p class="home-title">Gelir · Gider · Kâr</p>
    <h2 class="home-sub">Hangi şube?</h2>
    <button class="branch-btn" data-go="anzi">
      <div class="branch-mark" style="background:#cf3f2b"><span>A</span><img src="logo-anzi.png" alt="" onerror="this.remove()"></div>
      <div><div class="nm">Anzi Sushi</div><div class="ds">Kayıt, kâr/zarar, tedarikçi fiyatları</div></div>
      <div class="arr">›</div>
    </button>
    <button class="branch-btn" data-go="ogi">
      <div class="branch-mark" style="background:#3346a8"><span>O</span><img src="logo-ogi.png" alt="" onerror="this.remove()"></div>
      <div><div class="nm">Ogi Moji</div><div class="ds">Kayıt, kâr/zarar, tedarikçi fiyatları</div></div>
      <div class="arr">›</div>
    </button>
    <div id="homeNote" class="note hidden" style="margin-top:12px"></div>
  </div>
</section>

<!-- BRANCH -->
<section id="branch" class="hidden">
  <header class="top"><div class="wrap">
    <button class="back" id="backBtn" aria-label="Geri">‹</button>
    <h1><span class="dot"></span><span id="brName"></span></h1>
  </div></header>

  <main><div class="wrap">
    <div id="note" class="note hidden"></div>

    <!-- KAYIT -->
    <div id="pane-kayit">
      <div class="today" id="todayBox"></div>
      <div class="card">
        <div class="seg">
          <button class="gider on" data-type="gider">− Gider</button>
          <button class="gelir" data-type="gelir">+ Gelir</button>
        </div>
        <div class="amount"><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0"><span>₺</span></div>
        <div class="chips" id="catChips"></div>
        <div class="row2">
          <input type="date" class="field" id="txDate">
          <input class="field" id="txNote" placeholder="Not (isteğe bağlı)" maxlength="120">
        </div>
        <button class="save gider" id="saveTx">Gideri Kaydet</button>
      </div>
      <div class="card list"><p class="label">Son kayıtlar</p><div id="recent"></div></div>
    </div>

    <!-- RAPOR -->
    <div id="pane-rapor" class="hidden">
      <div class="periods" id="periods"></div>
      <div class="card net" id="netBox"></div>
      <div class="two" id="twoBox"></div>
      <div class="card"><p class="label">Gider dağılımı</p><div id="giderBars"></div></div>
      <div class="card"><p class="label">Gelir dağılımı</p><div id="gelirBars"></div></div>
      <div class="card"><p class="label">Son 6 ay</p><div id="months"></div></div>
    </div>

    <!-- FIYAT -->
    <div id="pane-fiyat" class="hidden">
      <div class="card pform">
        <p class="label">Fiyat ekle</p>
        <div class="grid">
          <input class="field full" id="pProd" list="prodList" placeholder="Ürün (ör. Somon)" maxlength="60">
          <input class="field full" id="pSup" list="supList" placeholder="Firma / Tedarikçi" maxlength="60">
          <input class="field" id="pPrice" inputmode="decimal" placeholder="Fiyat ₺">
          <select class="field" id="pUnit">
            <option value="kg">/ kg</option><option value="adet">/ adet</option><option value="lt">/ lt</option>
            <option value="paket">/ paket</option><option value="koli">/ koli</option><option value="gr">/ gr</option>
          </select>
          <input type="date" class="field full" id="pDate">
        </div>
        <datalist id="prodList"></datalist><datalist id="supList"></datalist>
        <button class="save" id="savePrice" style="background:var(--accent)">Fiyatı Kaydet</button>
      </div>
      <input class="field search" id="pSearch" placeholder="Ürün ara…">
      <div id="priceList"></div>
      <p class="hint">Her firmanın en son fiyatı gösterilir. Geçmiş fiyatlar için ürüne dokunun.</p>
    </div>
  </div></main>

  <nav class="tabs"><div class="wrap">
    <button data-tab="kayit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Kayıt</button>
    <button data-tab="rapor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Kâr / Zarar</button>
    <button data-tab="fiyat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Fiyatlar</button>
  </div></nav>
</section>

<div class="toast" id="toast"></div>

<div id="lock">
  <div class="box">
    <h2>Şifre</h2>
    <p>Devam etmek için 4 haneli şifreyi girin</p>
    <div class="pins" id="pins"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="ghost"></button><button>0</button><button class="ghost" data-k="del">Sil</button>
    </div>
    <div id="lockErr"></div>
  </div>
</div>

<script>
(function(){
const BR={anzi:"Anzi Sushi",ogi:"Ogi Moji"};
const CATS={
  gider:["Balık / Deniz ürünü","Pirinç & Kuru gıda","Sebze & Meyve","Sos & Baharat","Ambalaj","Personel","Kira","Fatura","Komisyon","Diğer"],
  gelir:["Salon","Paket servis","Yemeksepeti","Getir","Trendyol Yemek","Diğer"]
};
const PERIODS=[["today","Bugün"],["week","Bu hafta"],["month","Bu ay"],["lastmonth","Geçen ay"],["year","Bu yıl"],["all","Tümü"]];
const AYLAR=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];

const SB_URL="https://wnkhvnzwxjbrhxooipii.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indua2h2bnp3eGpicmh4b29pcGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyODc4MjEsImV4cCI6MjEwOTg2MzgyMX0.vLg-nOdQTb6bLBQ7LxB7wl8QU1RpYc45Br5CHqJpe70";
const PIN_KEY="anzi-pin";
let PIN=null; try{PIN=localStorage.getItem(PIN_KEY)}catch(e){}
let cur=null, tab="kayit", dbReady=false, loadSeq=0;
let txs=[], prices=[];
const db=true;
let entryType="gider", entryCat=null, period="month";

const $=id=>document.getElementById(id);
const fmt=new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:2});
const money=n=>fmt.format(n||0);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const trDate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"."+m+"."+y};
const norm=s=>String(s||"").trim().replace(/\s+/g," ").toLocaleLowerCase("tr");
function parseAmount(v){
  v=String(v||"").replace(/\s|₺/g,"");
  if(!v)return NaN;
  if(v.includes(",")) v=v.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(v)) v=v.replace(/\./g,"");
  return Math.round(parseFloat(v)*100)/100;
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1600)}
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");el.focus()}
function showNote(m){const n=$("note");n.textContent=m;n.classList.remove("hidden")}
function hideNote(){$("note").classList.add("hidden")}
function errMsg(e){
  if(e&&e.code==="pin")return"Şifre gerekli";
  if(e&&e.code==="network")return"İnternet bağlantısı yok";
  return"Kaydedilemedi, tekrar deneyin.";
}

/* ---------- Supabase ---------- */
async function rpc(fn,args){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
  let res;
  try{
    res=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+SB_KEY},
      body:JSON.stringify(Object.assign({p_pin:PIN},args||{}))});
  }catch(e){clearTimeout(to);throw{code:"network"}}
  clearTimeout(to);
  if(!res.ok)throw{code:"server",status:res.status};
  const j=await res.json();
  if(j&&j.error==="pin"){lockOut();throw{code:"pin"}}
  return j;
}
const mapRow=r=>Object.assign({},r,{amount:+r.amount,price:+r.price,createdAt:Date.parse(r.created_at)||0});
async function load(b){
  if(!b||!PIN)return;
  const seq=++loadSeq;
  try{
    const d=await rpc("anzi_data",{p_branch:b});
    if(seq!==loadSeq||b!==cur)return;
    txs=(d.tx||[]).map(mapRow);prices=(d.prices||[]).map(mapRow);dbReady=true;hideNote();renderAll();
  }catch(e){
    if(seq!==loadSeq||e.code==="pin")return;
    dbReady=true;showNote("Veriler yüklenemedi. İnternet bağlantınızı kontrol edin.");renderAll();
  }
}
function subscribe(b){txs=[];prices=[];dbReady=false;hideNote();renderAll();load(b)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&cur)load(cur)});
setInterval(()=>{if(!document.hidden&&cur)load(cur)},60000);

/* ---------- Routing ---------- */
function route(){
  const h=(location.hash||"").slice(1);
  const m=h.match(/^(anzi|ogi)(?:-(rapor|fiyat))?$/);
  if(!m){
    cur=null;
    document.body.className="";$("branch").classList.add("hidden");$("home").classList.remove("hidden");window.scrollTo(0,0);return;
  }
  const b=m[1],t=m[2]||"kayit";
  if(b!==cur){cur=b;entryCat=null;subscribe(b);window.scrollTo(0,0)}
  tab=t;
  document.body.className=b;
  $("brName").textContent=BR[b];
  $("home").classList.add("hidden");$("branch").classList.remove("hidden");
  ["kayit","rapor","fiyat"].forEach(x=>$("pane-"+x).classList.toggle("hidden",x!==t));
  document.querySelectorAll("nav.tabs button").forEach(el=>el.classList.toggle("on",el.dataset.tab===t));
  renderAll();
}
function go(b,t){location.hash=b+(t&&t!=="kayit"?"-"+t:"")}
document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
$("backBtn").onclick=()=>{location.hash="home"};
document.querySelectorAll("nav.tabs button").forEach(el=>el.onclick=()=>{go(cur,el.dataset.tab);window.scrollTo(0,0)});
window.addEventListener("hashchange",route);

/* ---------- Entry ---------- */
function setType(t){
  entryType=t;entryCat=null;
  document.querySelectorAll(".seg button").forEach(el=>el.classList.toggle("on",el.dataset.type===t));
  const s=$("saveTx");s.className="save "+t;s.textContent=t==="gider"?"Gideri Kaydet":"Geliri Kaydet";
  renderChips();
}
document.querySelectorAll(".seg button").forEach(el=>el.onclick=()=>{setType(el.dataset.type);$("amt").focus()});
function renderChips(){
  $("catChips").innerHTML=CATS[entryType].map(c=>`<button class="chip${c===entryCat?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("catChips").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{entryCat=entryCat===el.dataset.c?null:el.dataset.c;renderChips()});
}
$("amt").addEventListener("keydown",e=>{if(e.key==="Enter")saveTx()});
$("saveTx").onclick=saveTx;
async function saveTx(){
  const amt=parseAmount($("amt").value);
  if(!(amt>0)){shake($("amt").parentElement);$("amt").focus();return}
  if(!entryCat){shake($("catChips"));toast("Kategori seçin");return}
  const btn=$("saveTx");btn.disabled=true;
  try{
    const r=await rpc("anzi_add_tx",{p_branch:cur,p_type:entryType,p_amount:amt,p_category:entryCat,p_note:$("txNote").value.trim(),p_date:$("txDate").value||today()});
    txs.push(mapRow(r));renderAll();
    toast((entryType==="gider"?"Gider":"Gelir")+" kaydedildi ✓");
    $("amt").value="";$("txNote").value="";entryCat=null;renderChips();
  }catch(e){toast(errMsg(e))}
  btn.disabled=false;
}

function armDelete(btn,fn){
  if(btn.classList.contains("arm")){fn();return}
  btn.classList.add("arm");btn.textContent="Emin misin?";
  setTimeout(()=>{btn.classList.remove("arm");btn.textContent="Sil"},3000);
}

/* ---------- Render ---------- */
function sortTx(a){return a.slice().sort((x,y)=>(y.date||"").localeCompare(x.date||"")||(y.createdAt||0)-(x.createdAt||0))}
function sum(list,type){return list.reduce((s,t)=>s+(t.type===type?(+t.amount||0):0),0)}

function renderKayit(){
  const td=today(),tl=txs.filter(t=>t.date===td);
  const gi=sum(tl,"gelir"),ge=sum(tl,"gider"),n=gi-ge;
  $("todayBox").innerHTML=`
    <div class="mini"><div class="k">Bugün gelir</div><div class="v pos">${money(gi)}</div></div>
    <div class="mini"><div class="k">Bugün gider</div><div class="v neg">${money(ge)}</div></div>
    <div class="mini"><div class="k">Bugün net</div><div class="v ${n>=0?"pos":"neg"}">${money(n)}</div></div>`;
  const list=sortTx(txs).slice(0,40);
  if(!list.length){$("recent").innerHTML=`<div class="empty">${dbReady?"Henüz kayıt yok. Yukarıdan ilk kaydı girin.":"Yükleniyor…"}</div>`;return}
  const y=new Date();y.setDate(y.getDate()-1);const yd=ymd(y);
  let html="",last=null;
  for(const t of list){
    if(t.date!==last){last=t.date;html+=`<div class="day">${t.date===td?"Bugün":t.date===yd?"Dün":trDate(t.date)}</div>`}
    const g=t.type==="gelir";
    html+=`<div class="item"><div class="ic ${g?"gelir":"gider"}">${g?"+":"−"}</div>
      <div class="t"><b>${esc(t.category)}</b>${t.note?`<small>${esc(t.note)}</small>`:""}</div>
      <div class="a ${g?"gelir":"gider"}">${g?"+":"−"}${money(t.amount)}</div>
      <button class="del" data-id="${esc(t.id)}">Sil</button></div>`;
  }
  $("recent").innerHTML=html;
  $("recent").querySelectorAll(".del").forEach(b=>b.onclick=()=>armDelete(b,async()=>{
    try{await rpc("anzi_delete",{p_kind:"tx",p_id:b.dataset.id});txs=txs.filter(t=>t.id!==b.dataset.id);renderAll();toast("Silindi")}catch(e){toast(errMsg(e))}
  }));
}

function inPeriod(d,p){
  if(!d)return false;const now=new Date(),td=today();
  const ym=now.getFullYear()+"-"+pad(now.getMonth()+1);
  switch(p){
    case"today":return d===td;
    case"week":{const s=new Date();s.setDate(s.getDate()-((s.getDay()+6)%7));return d>=ymd(s)&&d<=td}
    case"month":return d.startsWith(ym);
    case"lastmonth":{const l=new Date(now.getFullYear(),now.getMonth()-1,1);return d.startsWith(l.getFullYear()+"-"+pad(l.getMonth()+1))}
    case"year":return d.startsWith(String(now.getFullYear()));
    default:return true;
  }
}
function bars(list,type,color){
  const m={};list.filter(t=>t.type===type).forEach(t=>{m[t.category]=(m[t.category]||0)+(+t.amount||0)});
  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);if(!e.length)return`<div class="empty">Bu dönemde kayıt yok</div>`;
  const tot=e.reduce((s,x)=>s+x[1],0),max=e[0][1];
  return e.map(([k,v])=>`<div class="bar"><div class="hd"><span>${esc(k)}</span><span>${money(v)} · %${Math.round(v/tot*100)}</span></div>
    <div class="tr"><div class="fl" style="width:${Math.max(3,v/max*100)}%;background:${color}"></div></div></div>`).join("");
}
function renderRapor(){
  $("periods").innerHTML=PERIODS.map(([k,l])=>`<button data-p="${k}" class="${k===period?"on":""}">${l}</button>`).join("");
  $("periods").querySelectorAll("button").forEach(b=>b.onclick=()=>{period=b.dataset.p;renderRapor()});
  const list=txs.filter(t=>inPeriod(t.date,period));
  const gi=sum(list,"gelir"),ge=sum(list,"gider"),n=gi-ge;
  const marj=gi>0?Math.round(n/gi*1000)/10:null;
  $("netBox").innerHTML=`<div class="k">${n>=0?"Net kâr":"Net zarar"} · ${PERIODS.find(p=>p[0]===period)[1]}</div>
    <div class="v ${n>=0?"pos":"neg"}">${money(n)}</div>
    <div class="m">${marj===null?"Gelir girilmemiş":"Kâr marjı %"+String(marj).replace(".",",")} · ${list.length} kayıt</div>`;
  $("twoBox").innerHTML=`<div class="card"><p class="label">Gelir</p><div class="big pos">${money(gi)}</div></div>
    <div class="card"><p class="label">Gider</p><div class="big neg">${money(ge)}</div></div>`;
  $("giderBars").innerHTML=bars(list,"gider","var(--gider)");
  $("gelirBars").innerHTML=bars(list,"gelir","var(--gelir)");
  const now=new Date();let rows="";
  for(let i=0;i<6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1),key=d.getFullYear()+"-"+pad(d.getMonth()+1);
    const ml=txs.filter(t=>(t.date||"").startsWith(key));const a=sum(ml,"gelir"),b=sum(ml,"gider"),c=a-b;
    rows+=`<tr><td>${AYLAR[d.getMonth()]} ${d.getFullYear()}</td><td class="pos">${money(a)}</td><td class="neg">${money(b)}</td><td class="${c>=0?"pos":"neg"}">${money(c)}</td></tr>`;
  }
  $("months").innerHTML=`<table class="mt"><thead><tr><th>Ay</th><th>Gelir</th><th>Gider</th><th>Net</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderFiyat(){
  const uniq=f=>{const m=new Map();prices.forEach(p=>{const k=norm(p[f]);if(k&&!m.has(k))m.set(k,p[f].trim())});return[...m.values()].sort((a,b)=>a.localeCompare(b,"tr"))};
  $("prodList").innerHTML=uniq("product").map(v=>`<option value="${esc(v)}">`).join("");
  $("supList").innerHTML=uniq("supplier").map(v=>`<option value="${esc(v)}">`).join("");
  const q=norm($("pSearch").value);
  const groups={};
  prices.forEach(p=>{const k=norm(p.product)+"|"+(p.unit||"");if(!groups[k])groups[k]={name:p.product,unit:p.unit,rows:[]};groups[k].rows.push(p)});
  let keys=Object.keys(groups).filter(k=>!q||k.includes(q)).sort((a,b)=>a.localeCompare(b,"tr"));
  if(!keys.length){$("priceList").innerHTML=`<div class="card empty">${prices.length?"Aramayla eşleşen ürün yok":"Henüz fiyat girilmedi. Yukarıdan ürün, firma ve fiyat ekleyin."}</div>`;return}
  const open=new Set([...document.querySelectorAll("details.prod[open]")].map(d=>d.dataset.k));
  $("priceList").innerHTML=keys.map(k=>{
    const g=groups[k];
    const rows=g.rows.slice().sort((x,y)=>(y.date||"").localeCompare(x.date||"")||(y.createdAt||0)-(x.createdAt||0));
    const latest={};rows.forEach(r=>{const s=norm(r.supplier);if(!latest[s])latest[s]=r});
    const sups=Object.values(latest).sort((a,b)=>a.price-b.price);
    const best=sups[0].price;
    const supHtml=sups.map((s,i)=>{
      const diff=best>0?Math.round((s.price-best)/best*100):0;
      return`<div class="sup"><span class="n">${esc(s.supplier)}</span>
        ${i===0&&sups.length>1?`<span class="tag best">En ucuz</span>`:""}${i>0&&diff>0?`<span class="tag up">+%${diff}</span>`:""}
        <span class="p">${money(s.price)}</span></div>`}).join("");
    const hist=rows.map(r=>`<div class="hr"><span>${trDate(r.date)} · ${esc(r.supplier)}</span><b>${money(r.price)}</b><button class="del" data-id="${esc(r.id)}">Sil</button></div>`).join("");
    return`<details class="prod" data-k="${esc(k)}"${open.has(k)?" open":""}><summary>
      <div class="ph"><b>${esc(g.name)}</b><small>/ ${esc(g.unit)} · ${sups.length} firma</small></div>${supHtml}</summary>
      <div class="hist"><p class="label" style="margin:8px 0 2px">Fiyat geçmişi</p>${hist}</div></details>`;
  }).join("");
  $("priceList").querySelectorAll(".del").forEach(b=>b.onclick=e=>{e.preventDefault();armDelete(b,async()=>{
    try{await rpc("anzi_delete",{p_kind:"price",p_id:b.dataset.id});prices=prices.filter(p=>p.id!==b.dataset.id);renderAll();toast("Silindi")}catch(er){toast(errMsg(er))}
  })});
}
$("pSearch").addEventListener("input",renderFiyat);
$("savePrice").onclick=async()=>{
  const prod=$("pProd").value.trim().replace(/\s+/g," "),sup=$("pSup").value.trim().replace(/\s+/g," "),pr=parseAmount($("pPrice").value);
  if(!prod)return shake($("pProd"));if(!sup)return shake($("pSup"));if(!(pr>0))return shake($("pPrice"));
  const btn=$("savePrice");btn.disabled=true;
  try{
    const r=await rpc("anzi_add_price",{p_branch:cur,p_product:prod,p_supplier:sup,p_price:pr,p_unit:$("pUnit").value,p_date:$("pDate").value||today()});
    prices.push(mapRow(r));renderAll();
    toast("Fiyat kaydedildi ✓");$("pSup").value="";$("pPrice").value="";$("pSup").focus();
  }catch(e){toast(errMsg(e))}
  btn.disabled=false;
};

function renderAll(){
  if(!cur)return;
  if(tab==="kayit")renderKayit();else if(tab==="rapor")renderRapor();else renderFiyat();
}

/* ---------- PIN lock ---------- */
function unlock(){$("lock").classList.add("hidden");if(cur)load(cur)}
function lockOut(){PIN=null;try{localStorage.removeItem(PIN_KEY)}catch(e){}pin="";drawPins();$("lock").classList.remove("hidden")}
if(PIN)$("lock").classList.add("hidden");
let pin="",checking=false;
function drawPins(){[...$("pins").children].forEach((el,i)=>el.classList.toggle("f",i<pin.length))}
async function pressKey(k){
  if(checking)return;
  if(k==="del"){pin=pin.slice(0,-1);drawPins();return}
  if(!/^\d$/.test(k)||pin.length>=4)return;
  pin+=k;drawPins();$("lockErr").textContent="";
  if(pin.length===4){
    checking=true;PIN=pin;let msg="Şifre yanlış";
    try{const r=await rpc("anzi_login",{});if(r&&r.ok){try{localStorage.setItem(PIN_KEY,PIN)}catch(e){}checking=false;unlock();return}}
    catch(e){if(e.code==="network"||e.code==="server")msg="Bağlantı hatası, tekrar deneyin"}
    PIN=null;checking=false;$("lock").classList.remove("hidden");
    $("lockErr").textContent=msg;shake($("pins"));setTimeout(()=>{pin="";drawPins()},350);
  }
}
$("pad").querySelectorAll("button").forEach(b=>b.onclick=()=>pressKey(b.dataset.k||b.textContent));
document.addEventListener("keydown",e=>{if($("lock").classList.contains("hidden"))return;if(e.key==="Backspace")pressKey("del");else pressKey(e.key)});

/* ---------- Start ---------- */
$("txDate").value=today();$("pDate").value=today();
setType("gider");
route();
})();
</script>
